# A new static frontend. Attach the custom domain after testing its Render URL.
services:
  - type: web
    name: age-of-fronts-skirmish
    runtime: static
    branch: main
    buildCommand: >-
      npm install --global --ignore-scripts npm@12.1.0 &&
      npm ci --ignore-scripts &&
      VITE_SKIRMISH_SOURCE_URL="https://github.com/ELDamien3570/AgeOfFronts/tree/${RENDER_GIT_COMMIT:?}" npm run build:skirmish
    staticPublishPath: ./build/skirmish
    envVars:
      - key: NODE_VERSION
        value: "24.18.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_MULTIPLAYER_URL
        sync: false
  - type: web
    name: age-of-fronts-multiplayer
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install --global --ignore-scripts npm@12.1.0 && npm ci --ignore-scripts
    startCommand: npm run start:multiplayer
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24.18.0"
      - key: HOST
        value: "0.0.0.0"
      - key: MULTIPLAYER_ORIGINS
        value: "https://ageoffronts.com,https://www.ageoffronts.com"
      - key: MULTIPLAYER_MATCH_CAPACITY
        value: "1"
