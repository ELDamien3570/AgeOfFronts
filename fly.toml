# fly.toml app configuration file generated for ageoffronts on 2026-10-01T21:20:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ageoffronts'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  MULTIPLAYER_MATCH_CAPACITY = '2'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
