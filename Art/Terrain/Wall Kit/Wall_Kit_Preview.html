<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wall Kit · All Ages</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,sans-serif; background:#141d19; color:#edf1e9; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; }
    main { max-width:1140px; margin:auto; }
    .heading { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:18px; }
    h1 { font-size:27px; margin:0 0 5px; letter-spacing:-.6px; font-weight:650; }
    .subtitle { margin:0; color:#b6c4b9; font-size:14px; }
    .badge { border:1px solid #5c6850; border-radius:20px; padding:7px 12px; color:#d3c28e; font-size:12px; white-space:nowrap; }
    .age-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    button,select { font:inherit; font-size:13px; cursor:pointer; color:#eff1e8; background:#334439; border:1px solid #526759; border-radius:7px; padding:7px 12px; }
    button:hover { background:#475e4e; }
    .age-tabs [aria-selected=true] { background:#d3b879; color:#1d281e; border-color:#d3b879; font-weight:700; }
    button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible { outline:2px solid #a4ddd0; outline-offset:3px; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:16px; background:#25352b; border:1px solid #3d5142; border-radius:12px; padding:12px 14px; margin-bottom:18px; }
    label { display:inline-flex; align-items:center; gap:7px; color:#c5d2c7; font-size:13px; }
    input { accent-color:#d3b879; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .large .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .single-age .grid { grid-template-columns:1fr; }
    article { background:#24332a; border:1px solid #405746; border-radius:12px; overflow:hidden; }
    article header { padding:11px 14px; border-bottom:1px solid #405746; }
    article h2 { margin:0 0 4px; font-size:14px; font-weight:600; }
    .description { color:#c8bd99; font-size:12px; }
    .stage { display:flex; justify-content:flex-start; align-items:center; min-height:250px; background:#1d2c22; padding:12px; overflow:auto; }
    canvas { display:block; flex-shrink:0; margin:auto; }
    article footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding:8px 14px; color:#aabfb0; font-size:11px; }
    a { color:#ddc58f; text-decoration:none; }
    a:hover { text-decoration:underline; }
    #status { color:#b6c4b9; font-size:13px; margin:18px 0 10px; }
    .review-links { display:flex; flex-wrap:wrap; gap:20px; font-size:12px; }
    .note { font-size:12px; color:#a6bba9; margin:0 0 12px; }
    @media (max-width:760px) { body { padding:15px; } .badge { display:none; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .large .grid { grid-template-columns:1fr; } }
    @media (max-width:540px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <div><h1 id="review-title">Wall Kit · All Ages</h1><p class="subtitle">Timber palisades → stone walls → massive fortifications</p></div>
      <div class="badge">3 ages · 48 walls · 3 towers</div>
    </header>
    <nav class="age-tabs" id="ages" role="tablist" aria-label="Wall age"></nav>
    <div class="toolbar">
      <label>View <select id="view"><option value="enclosure">Connected enclosures</option><option value="tiles">All 16 pieces</option><option value="corners">Four corner joins</option><option value="tower">Tower only</option></select></label>
      <label>Cell size <select id="size"><option value="24">24 px</option><option value="32" selected>32 px</option><option value="48">48 px</option><option value="64">64 px</option><option value="128">128 px</option><option value="256">256 px</option></select></label>
      <label>Ground <select id="ground"><option value="grass">Grass</option><option value="sand">Sand</option><option value="snow">Snow</option><option value="checker">Checkerboard</option><option value="dark">Dark</option></select></label>
      <label><input id="towers" type="checkbox" checked>Corner towers</label>
      <label><input id="grid" type="checkbox">Cell boundaries</label>
      <button id="reset" type="button">Reset view</button>
    </div>
    <section id="age-panel" role="tabpanel" aria-busy="true"><div class="grid" id="walls"></div></section>
    <p id="status" role="status">Loading wall kits…</p>
    <p class="note">Transparent walls and towers · north / east / south / west connections · towers fit all four bends</p>
    <p class="review-links"><a href="../Trade%20Roads/Road_Tile_Preview.html">Road tiles ↗</a><a href="../../Trader%20Icons/Trader_Animation_Preview.html">Trader animations ↗</a><a href="Wall_Kit_Manifest.json" target="_blank" rel="noopener">Asset manifest ↗</a><a href="README.md" target="_blank" rel="noopener">Wall guide ↗</a></p>
  </main>
  <script>
    // Review-only MVVM. Art metadata is kept separate from display state.
    // Unlock labels in this catalog do not change the game domain.
    const assetModel = {
      tiers:[], ground:null, layout:null, version:Date.now(),
      async json(path) {
        const response=await fetch(`${path}?review=${this.version}`);
        if (!response.ok) throw new Error(`${path} unavailable (${response.status})`);
        return response.json();
      },
      async image(path) {
        const image=new Image(); image.src=`${path}?review=${this.version}`; await image.decode(); return image;
      },
      async initialize() {
        const manifest=await this.json('Wall_Kit_Manifest.json');
        [this.ground,this.layout]=await Promise.all([this.image(manifest.previewGround),this.json('review-layout.json')]);
        this.tiers=await Promise.all(manifest.tiers.map(async tier => {
          const [metadata,atlas,tower]=await Promise.all([this.json(tier.metadata),this.image(tier.atlas),this.image(tier.tower)]);
          if (metadata.tileSize!==256 || metadata.tiles.length!==16 || atlas.naturalWidth!==1024 || atlas.naturalHeight!==1024 || tower.naturalWidth!==256 || tower.naturalHeight!==256) throw new Error(`Invalid wall kit: ${tier.label}`);
          return {...tier,metadata,atlasImage:atlas,towerImage:tower};
        }));
      },
    };
    const viewModel={selection:'Overview',view:'enclosure',cellSize:32,ground:'grass',towers:true,grid:false};
    const elements=Object.fromEntries(['walls','ages','age-panel','status','review-title','view','size','ground','towers','grid'].map(id => [id,document.getElementById(id)]));
    const viewLabels={enclosure:'Connected enclosures',tiles:'All 16 connection patterns',corners:'All four corner joins',tower:'Independent tower sprites'};
    const canvasView={
      background(ctx,width,height) {
        const size=viewModel.cellSize;
        if (viewModel.ground==='grass') {
          for (let y=0;y<height;y+=size) for (let x=0;x<width;x+=size) ctx.drawImage(assetModel.ground,x,y,size,size);
        } else if (viewModel.ground==='checker') {
          const checker=Math.max(8,Math.round(size/4));
          for (let y=0;y<height;y+=checker) for (let x=0;x<width;x+=checker) {
            ctx.fillStyle=((Math.floor(x/checker)+Math.floor(y/checker))%2) ? '#aeb8ad' : '#dae0d6'; ctx.fillRect(x,y,checker,checker);
          }
        } else {
          ctx.fillStyle={sand:'#c5ad77',snow:'#e0e6e5',dark:'#202925'}[viewModel.ground]; ctx.fillRect(0,0,width,height);
        }
      },
      draw(canvas,asset) {
        const size=viewModel.cellSize, view=viewModel.view;
        const columns=view==='enclosure' ? assetModel.layout.width : view==='tiles' ? 4 : view==='corners' ? 2 : 1;
        const rows=view==='enclosure' ? assetModel.layout.height : view==='tiles' ? 4 : view==='corners' ? 2 : 1;
        canvas.width=columns*size; canvas.height=rows*size; canvas.style.width=`${canvas.width}px`; canvas.style.height=`${canvas.height}px`;
        const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=true; this.background(ctx,canvas.width,canvas.height);
        for (let y=0;y<rows;y++) for (let x=0;x<columns;x++) {
          const mask=view==='enclosure' ? assetModel.layout.cells[y][x] : view==='tiles' ? y*4+x : view==='corners' ? assetModel.layout.cornerMasks[y*2+x] : null;
          if (mask!==null) {
            const {rect}=asset.metadata.tiles[mask];
            ctx.drawImage(asset.atlasImage,rect.x,rect.y,rect.width,rect.height,x*size,y*size,size,size);
          }
          if (view==='tower' || (viewModel.towers && mask!==null && assetModel.layout.recommendedTowerMasks.includes(mask))) ctx.drawImage(asset.towerImage,x*size,y*size,size,size);
        }
        if (viewModel.grid) {
          ctx.strokeStyle='rgba(245,231,185,.48)'; ctx.lineWidth=1; ctx.beginPath();
          for (let x=0;x<=columns;x++) { ctx.moveTo(x*size+.5,0); ctx.lineTo(x*size+.5,canvas.height); }
          for (let y=0;y<=rows;y++) { ctx.moveTo(0,y*size+.5); ctx.lineTo(canvas.width,y*size+.5); }
          ctx.stroke();
        }
      },
      card(asset) {
        const article=document.createElement('article'), header=document.createElement('header');
        const title=document.createElement('h2'); title.textContent=asset.unlockAgeLabel;
        const description=document.createElement('div'); description.className='description'; description.textContent=asset.label; header.append(title,description);
        const stage=document.createElement('div'); stage.className='stage';
        const canvas=document.createElement('canvas'); canvas.setAttribute('aria-label',`${asset.unlockAgeLabel} ${asset.label}: ${viewLabels[viewModel.view].toLowerCase()}`); stage.append(canvas);
        const footer=document.createElement('footer');
        for (const [href,label] of [[asset.atlas,'Wall atlas ↗'],[asset.tower,'Tower ↗']]) {
          const link=document.createElement('a'); link.href=href; link.textContent=label; link.target='_blank'; link.rel='noopener'; footer.append(link);
        }
        const count=document.createElement('span'); count.textContent='16 pieces + tower'; footer.append(count);
        article.append(header,stage,footer); elements.walls.append(article); this.draw(canvas,asset);
      },
    };
    function render() {
      const overview=viewModel.selection==='Overview';
      const tiers=overview ? assetModel.tiers : assetModel.tiers.filter(tier => tier.id===viewModel.selection);
      document.body.classList.toggle('single-age',!overview); document.body.classList.toggle('large',viewModel.cellSize>32);
      const label=overview ? 'All Ages' : `${tiers[0].unlockAgeLabel} · ${tiers[0].label}`;
      elements['review-title'].textContent=`Wall Kit · ${label}`; document.title=`Wall Kit · ${label}`;
      elements['age-panel'].setAttribute('aria-labelledby',`tab-${viewModel.selection}`);
      for (const tab of elements.ages.children) { const active=tab.dataset.tier===viewModel.selection; tab.setAttribute('aria-selected',String(active)); tab.tabIndex=active ? 0 : -1; }
      elements.walls.replaceChildren(); for (const tier of tiers) canvasView.card(tier);
      elements.status.textContent=`${tiers.length} / ${tiers.length} wall kits loaded · ${viewLabels[viewModel.view]} · ${viewModel.cellSize} px per cell`;
      elements.towers.disabled=viewModel.view==='tower';
    }
    function selectTier(tier,updateLocation=true) { viewModel.selection=tier; if (updateLocation) history.replaceState(null,'',`#${tier}`); render(); }
    for (const [id,key,convert] of [['view','view',String],['size','cellSize',Number],['ground','ground',String]]) elements[id].addEventListener('change',() => { viewModel[key]=convert(elements[id].value); render(); });
    for (const id of ['towers','grid']) elements[id].addEventListener('change',() => { viewModel[id]=elements[id].checked; render(); });
    document.getElementById('reset').addEventListener('click',() => {
      Object.assign(viewModel,{view:'enclosure',cellSize:32,ground:'grass',towers:true,grid:false});
      elements.view.value='enclosure'; elements.size.value='32'; elements.ground.value='grass'; elements.towers.checked=true; elements.grid.checked=false; selectTier('Overview');
    });
    assetModel.initialize().then(() => {
      for (const [id,label] of [['Overview','All ages'],...assetModel.tiers.map(tier => [tier.id,tier.unlockAgeLabel])]) {
        const button=document.createElement('button'); button.type='button'; button.id=`tab-${id}`; button.dataset.tier=id; button.textContent=label; button.setAttribute('role','tab'); button.setAttribute('aria-controls','age-panel');
        button.addEventListener('click',() => selectTier(id)); elements.ages.append(button);
      }
      elements.ages.addEventListener('keydown',event => {
        const tabs=[...elements.ages.children], index=tabs.indexOf(document.activeElement);
        if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key) || index<0) return;
        event.preventDefault(); const next=event.key==='Home' ? 0 : event.key==='End' ? tabs.length-1 : (index+(event.key==='ArrowRight' ? 1 : -1)+tabs.length)%tabs.length;
        tabs[next].focus(); selectTier(tabs[next].dataset.tier);
      });
      const requested=location.hash.slice(1); if (requested==='Overview' || assetModel.tiers.some(tier => tier.id===requested)) viewModel.selection=requested;
      elements['age-panel'].setAttribute('aria-busy','false'); render();
    }).catch(error => { elements.status.textContent=`Could not load the wall kit: ${error.message}. Open this page through the project's local art server.`; elements['age-panel'].setAttribute('aria-busy','false'); console.error(error); });
  </script>
</body>
</html>
