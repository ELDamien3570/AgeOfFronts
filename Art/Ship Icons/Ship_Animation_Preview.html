<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ship Animation Review</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141c21; color: #edf0eb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1140px; margin: auto; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1 { font-size: 27px; margin: 0 0 5px; font-weight: 650; letter-spacing: -.6px; }
    .subtitle { margin: 0; font-size: 14px; color: #aebec3; }
    .badge { color: #e2b875; border: 1px solid #655139; border-radius: 20px; padding: 7px 12px; font-size: 12px; white-space: nowrap; }
    .age-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .age-tabs [aria-selected=true] { background: #d5b071; color: #19201d; border-color: #d5b071; font-weight: 700; }
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #a5dfda; outline-offset: 3px; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; background: #212d32; border: 1px solid #34454d; border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; }
    button, select { color: #eff1eb; background: #303e44; border: 1px solid #4d626a; border-radius: 7px; padding: 7px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    button:hover { background: #465b63; }
    #play { background: #d5b071; color: #19201d; border-color: #d5b071; font-weight: 700; min-width: 80px; }
    label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #c5d0d4; }
    input[type=range] { accent-color: #d5b071; width: 120px; }
    input[type=checkbox] { accent-color: #d5b071; }
    output { min-width: 55px; font-size: 12px; font-variant-numeric: tabular-nums; color: #d7c9ac; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .grid .unit-start { grid-column-start: 1; }
    .large .grid { grid-template-columns: repeat(2, 1fr); }
    .large .stage { min-height: 540px; }
    article { background: #202d33; border: 1px solid #354b55; border-radius: 12px; overflow: hidden; }
    article header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0; padding: 10px 14px; border-bottom: 1px solid #354b55; }
    article h2 { margin: 0; font-size: 14px; font-weight: 600; }
    article header span { color: #d5b071; font-size: 12px; }
    .stage { display: flex; align-items: center; justify-content: center; min-height: 280px; background: #1a4b62; }
    .checker .stage { background-color: #334448; background-image: linear-gradient(45deg,#3d5155 25%,transparent 25%),linear-gradient(-45deg,#3d5155 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3d5155 75%),linear-gradient(-45deg,transparent 75%,#3d5155 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
    .white .stage { background: #eef1ef; }
    .dark .stage { background: #0a1116; }
    canvas { display: block; width: min(var(--sprite-size, 256px),100%); height: auto; aspect-ratio: 1; }
    article footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px; font-size: 11px; color: #a3b9c2; }
    article a, .review-links a { color: #dbbd87; text-decoration: none; }
    article a:hover, .review-links a:hover { text-decoration: underline; }
    .frame { font-variant-numeric: tabular-nums; }
    #status { color: #aebec3; font-size: 13px; margin: 18px 0 8px; }
    .review-links { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; margin: 0 0 16px; }
    @media (max-width: 760px) { body { padding: 15px; } .grid { grid-template-columns: repeat(2,1fr); } .badge { display: none; } .stage { min-height: 230px; } }
    @media (max-width: 760px) { .large .grid { grid-template-columns: 1fr; } }
    @media (max-width: 470px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <div><h1 id="review-title">Ship Animation Review</h1><p class="subtitle">Straight overhead · bow up · idle, sailing and warship attacks</p></div>
      <div class="badge" id="fleet-count">21 ships · 49 clips · transparent PNG</div>
    </header>
    <nav class="age-tabs" id="ages" role="tablist" aria-label="Ship age"></nav>
    <div class="toolbar">
      <button id="play" type="button">Pause</button>
      <button id="previous" type="button" aria-label="Previous frame">‹</button>
      <button id="next" type="button" aria-label="Next frame">›</button>
      <label>Frame <input id="frame" type="range" min="0" max="9" value="0" aria-label="Animation frame"></label>
      <output id="frame-output">1 / 10</output>
      <label>Speed <select id="speed"><option value="0.5">½ speed</option><option value="1" selected>Normal</option><option value="1.5">1½ speed</option></select></label>
      <label>Size <select id="size"><option value="24">24 px</option><option value="32">32 px</option><option value="64">64 px</option><option value="128">128 px</option><option value="256" selected>256 px</option><option value="512">512 px</option></select></label>
      <label>Backdrop <select id="background"><option value="ocean">Ocean</option><option value="checker">Checkerboard</option><option value="white">White</option><option value="dark">Dark</option></select></label>
      <label><input id="pivot" type="checkbox">Pivot</label>
      <label><input id="repeat" type="checkbox" checked>Repeat attacks</label>
      <button id="restart" type="button">Restart</button>
    </div>
    <section id="age-panel" role="tabpanel" aria-busy="true"><div class="grid" id="clips"></div></section>
    <p id="status" role="status">Loading ship animations…</p>
    <p class="review-links"><a href="../Soldier%20Icons/StoneAge_Animation_Preview.html">Soldier preview ↗</a><a href="Ship_Animation_Manifest.json" target="_blank" rel="noopener">Asset manifest ↗</a><a href="README.md" target="_blank" rel="noopener">Animation notes ↗</a></p>
  </main>
  <script>
    // Review-only MVVM: asset model, playback view model, and canvas view.
    const assetModel = {
      ages: [
        ['StoneAge', 'Stone Age'], ['BronzeAge', 'Bronze Age'], ['ClassicalAge', 'Classical Age'],
        ['EarlyMedieval', 'Early Medieval'], ['LateMedieval', 'Late Medieval'], ['EarlyModern', 'Early Modern'], ['Modern', 'Modern'],
      ].map(([directory, label]) => ({ directory, label })),
      units: [{ directory: 'Warships', label: 'Warship', states: ['idle', 'sailing', 'attack'] }, { directory: 'Transport', label: 'Transport', states: ['idle', 'sailing'] }, { directory: 'Trade', label: 'Trade ship', states: ['idle', 'sailing'] }],
      version: Date.now(),
      async load(unit, age) {
        const response = await fetch(`${unit.directory}/${age.directory}/animations.json?review=${this.version}`);
        if (!response.ok) throw new Error(`Metadata unavailable (${response.status})`);
        const data = await response.json();
        if (data.frameSize.width !== 512 || data.frameSize.height !== 512) throw new Error('Unexpected frame dimensions');
        return data;
      },
    };
    const clipsPerAge = assetModel.units.reduce((count, unit) => count + unit.states.length, 0);
    document.getElementById('fleet-count').textContent = `${assetModel.ages.length * assetModel.units.length} ships · ${assetModel.ages.length * clipsPerAge} clips · transparent PNG`;
    const playback = { playing: true, seconds: 0, frame: 0, speed: 1, repeatAttacks: true, pivot: false, age: null, clips: [], revision: 0 };
    const elements = Object.fromEntries(['clips','ages','age-panel','play','frame','frame-output','status','review-title'].map(id => [id, document.getElementById(id)]));
    const labelState = state => state[0].toUpperCase() + state.slice(1);
    function selectFrame(frame) {
      playback.playing = false; playback.frame = (frame + 10) % 10; playback.seconds = 0;
      elements.play.textContent = 'Play'; elements.frame.value = playback.frame;
      elements['frame-output'].textContent = `${playback.frame + 1} / 10`;
    }
    function restart() { playback.frame = 0; playback.seconds = 0; elements.frame.value = 0; }
    async function loadAge(age, updateLocation = true) {
      const revision = ++playback.revision;
      playback.age = age; playback.clips = []; restart();
      elements['review-title'].textContent = `${age.label} · Ship Animation Review`;
      document.title = `${age.label} — Ship Animation Review`;
      elements['age-panel'].setAttribute('aria-labelledby', `tab-${age.directory}`);
      elements['age-panel'].setAttribute('aria-busy', 'true');
      for (const tab of elements.ages.children) {
        const selected = tab.dataset.age === age.directory;
        tab.setAttribute('aria-selected', String(selected)); tab.tabIndex = selected ? 0 : -1;
      }
      if (updateLocation) history.replaceState(null, '', `#${age.directory}`);
      elements.clips.replaceChildren();
      await Promise.all(assetModel.units.map(async unit => {
        // Append in unit/state order before asynchronous loading.
        const pending = unit.states.map(state => {
          const card = document.createElement('article');
          if (state === unit.states[0]) card.className = 'unit-start';
          const title = document.createElement('h2'); title.textContent = unit.label;
          const motion = document.createElement('span'); motion.textContent = labelState(state);
          const header = document.createElement('header'); header.append(title, motion);
          const canvas = document.createElement('canvas'); canvas.width = canvas.height = 512;
          canvas.setAttribute('aria-label', `${age.label} ${unit.label} ${state} animation`);
          const stage = document.createElement('div'); stage.className = 'stage'; stage.append(canvas);
          const footer = document.createElement('footer');
          const frame = document.createElement('span'); frame.className = 'frame'; frame.textContent = 'Loading…';
          const link = document.createElement('a'); link.textContent = 'Open sheet ↗'; link.target = '_blank'; link.rel = 'noopener';
          footer.append(frame, link); card.append(header, stage, footer); elements.clips.append(card);
          const clip = { unit, state, card, context: canvas.getContext('2d'), image: new Image(), data: null, failed: false, frameElement: frame, link };
          playback.clips.push(clip); return clip;
        });
        try {
          const data = await assetModel.load(unit, age);
          if (revision !== playback.revision) return;
          for (const clip of pending) {
            clip.data = data.animations[clip.state];
            if (!clip.data || clip.data.frameCount !== 10) throw new Error('Incomplete animation metadata');
            const url = `${unit.directory}/${age.directory}/${clip.data.file}?review=${assetModel.version}`;
            clip.link.href = url; clip.image.onerror = () => { clip.failed = true; }; clip.image.src = url;
          }
        } catch (error) {
          for (const clip of pending) { clip.failed = true; clip.frameElement.textContent = error.message; }
        }
      }));
    }
    for (const [index, age] of assetModel.ages.entries()) {
      const tab = document.createElement('button'); tab.type = 'button'; tab.id = `tab-${age.directory}`;
      tab.dataset.age = age.directory; tab.textContent = age.label;
      tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', 'age-panel');
      tab.addEventListener('click', () => loadAge(age));
      tab.addEventListener('keydown', event => {
        const keys = { ArrowRight: (index + 1) % 7, ArrowLeft: (index + 6) % 7, Home: 0, End: 6 };
        if (!(event.key in keys)) return;
        event.preventDefault(); event.stopPropagation(); loadAge(assetModel.ages[keys[event.key]]); elements.ages.children[keys[event.key]].focus();
      }); elements.ages.append(tab);
    }
    const locationAge = () => assetModel.ages.find(age => age.directory === location.hash.slice(1)) || assetModel.ages[0];
    loadAge(locationAge(), false); window.addEventListener('hashchange', () => loadAge(locationAge(), false));
    elements.play.addEventListener('click', () => {
      if (playback.playing) {
        const first = playback.clips.find(clip => clip.data);
        selectFrame(Math.floor(playback.seconds * (first?.data.suggestedFramesPerSecond || 8) + playback.frame) % 10);
      } else { playback.playing = true; elements.play.textContent = 'Pause'; }
    });
    elements.frame.addEventListener('input', () => selectFrame(Number(elements.frame.value)));
    document.getElementById('previous').addEventListener('click', () => selectFrame(playback.frame - 1));
    document.getElementById('next').addEventListener('click', () => selectFrame(playback.frame + 1));
    document.getElementById('restart').addEventListener('click', restart);
    document.getElementById('speed').addEventListener('change', event => { playback.speed = Number(event.target.value); });
    document.getElementById('repeat').addEventListener('change', event => { playback.repeatAttacks = event.target.checked; restart(); });
    document.getElementById('pivot').addEventListener('change', event => { playback.pivot = event.target.checked; });
    document.getElementById('size').addEventListener('change', event => {
      document.documentElement.style.setProperty('--sprite-size', `${event.target.value}px`);
      document.body.classList.toggle('large', Number(event.target.value) > 256);
    });
    document.getElementById('background').addEventListener('change', event => {
      document.body.classList.remove('ocean', 'checker', 'white', 'dark');
      document.body.classList.add(event.target.value);
    });
    document.addEventListener('keydown', event => {
      if (['INPUT','SELECT','BUTTON','A'].includes(event.target.tagName)) return;
      if (event.key === ' ') { event.preventDefault(); elements.play.click(); }
      if (event.key === 'ArrowRight') selectFrame(playback.frame + 1);
      if (event.key === 'ArrowLeft') selectFrame(playback.frame - 1);
    });
    let previousTime = performance.now();
    function render(now) {
      const delta = Math.min(.1, (now - previousTime) / 1000); previousTime = now;
      if (playback.playing) playback.seconds += delta * playback.speed;
      let loaded = 0;
      for (const clip of playback.clips) {
        const ctx = clip.context; ctx.clearRect(0, 0, 512, 512);
        if (clip.data && clip.image.complete && clip.image.naturalWidth) {
          loaded++;
          const progress = Math.floor(playback.frame + (playback.playing ? playback.seconds * clip.data.suggestedFramesPerSecond : 0));
          const index = clip.data.loop || playback.repeatAttacks ? progress % 10 : Math.min(9, progress);
          const frame = clip.data.frames[index];
          ctx.drawImage(clip.image, frame.x, frame.y, frame.width, frame.height, 0, 0, 512, 512);
          clip.frameElement.textContent = `Frame ${index + 1} / 10 · ${clip.data.suggestedFramesPerSecond} fps`;
        }
        if (playback.pivot) {
          ctx.strokeStyle = '#a5dfda'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(236,256); ctx.lineTo(276,256); ctx.moveTo(256,236); ctx.lineTo(256,276); ctx.stroke();
        }
      }
      const failed = playback.clips.filter(clip => clip.failed).length;
      const settled = loaded + failed === clipsPerAge;
      elements['age-panel'].setAttribute('aria-busy', String(!settled));
      const status = loaded === clipsPerAge ? `All ${clipsPerAge} ${playback.age.label} clips loaded. Pause and step through frames, or check motion at 24–32 px. Attacks repeat for review when enabled.` : `${playback.age.label}: ${loaded} / ${clipsPerAge} clips loaded${failed ? ` · ${failed} unavailable` : ''}`;
      if (elements.status.textContent !== status) elements.status.textContent = status;
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
