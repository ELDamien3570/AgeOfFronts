<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>
    Age of Fronts · boat presentation comparison</title
  ><style>
    body {
      margin: 0;
      background: #0c1722;
      color: #e5ecf4;
      font: 15px system-ui;
    }
    header {
      padding: 20px 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0 24px;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    .stage {
      height: 460px;
      position: relative;
      border: 1px solid #46607a;
      overflow: hidden;
    }
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .note {
      color: #aabacd;
      line-height: 1.5;
    }
    #status {
      padding: 16px 28px;
    }
    button {
      background: #263e56;
      color: #fff;
      border: 1px solid #657f99;
      padding: 8px;
      margin-right: 8px;
      border-radius: 5px;
    }
  </style>
  <header>
    <h1>Same boat art. Same 5 Hz snapshots.</h1>
    <div class="note">
      Actual game renderer, synthetic repeatable fleet. Left is ce5a316 main;
      right is the presentation-only prototype. No simulation or server changes.
    </div>
    <p>
      <button id="regular">Steady 200 ms</button
      ><button id="jitter">150/250 ms jitter + duplicate packets</button
      ><button id="pause">Pause / resume</button>
    </p>
  </header>
  <div class="panels">
    <section>
      <h2>Current main · snapshot steps</h2>
      <div class="stage"><canvas id="before"></canvas></div>
    </section>
    <section>
      <h2>Prototype · smooth position, heading & loops</h2>
      <div class="stage"><canvas id="after"></canvas></div>
    </section>
  </div>
  <div id="status"></div>
  <script type="module" src="./boat-presentation-preview.ts"></script>
</html>
