<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Debloat browser verification</title>
  <style>
    body {
      margin: 0;
      background: #152326;
      color: #f3ebd4;
      font: 16px system-ui;
    }
    header {
      padding: 12px;
    }
    button {
      padding: 8px;
    }
    #scene {
      height: 620px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      inset: 0;
    }
    .ground-layer {
      z-index: 0;
    }
    #battlefield {
      z-index: 1;
    }
    .strategic-sprites {
      z-index: 2;
      pointer-events: none;
    }
    .aircraft-layer {
      z-index: 3;
      pointer-events: none;
    }
    pre {
      white-space: pre-wrap;
      padding: 12px;
    }
  </style>
  <header>
    <h1>1,500-squad browser verification</h1>
    <button id="run">Run profile</button>
  </header>
  <div id="scene">
    <canvas id="battlefield" aria-label="1500 squad test scene"></canvas>
  </div>
  <pre id="result" role="status">
Ready. Synthetic presentation scene; this is not a multiplayer load qualification.</pre
  >
  <script type="module" src="./DebloatProfile.ts"></script>
</html>
