<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Sea trade lane review</title>
<link rel="stylesheet" href="/src/skirmish/client/style.css">
<style>body{margin:0;background:#152326;color:#f3ebd4;font:15px system-ui}body>header{padding:12px;position:sticky;top:0;z-index:100;background:#152326}#app{height:auto;display:block;overflow:visible}#resource-strip{display:none}.battlefield{height:auto;overflow:visible;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,480px);gap:12px}.battlefield>:not(#scene):not(#empire-panel){display:none}#app .empire-panel{position:relative;inset:auto;width:100%;max-width:none;max-height:470px;z-index:auto}button{padding:8px;margin:4px}#scene{height:470px;position:relative}canvas{width:100%;height:100%;display:block;position:absolute;inset:0}.ground-layer{z-index:0}#battlefield{z-index:1}.strategic-sprites{z-index:2;pointer-events:none}.aircraft-layer{z-index:3;pointer-events:none}#status{white-space:pre-wrap;padding:12px;max-height:300px;overflow:auto}.empire-panel{background:#203237;padding:16px}.empire-panel[hidden]{display:none}.hud,.diplomatic-notices,.selection-card,.empire-dock{display:none}@media(max-width:900px){.battlefield{grid-template-columns:1fr}#scene{height:300px}}</style>
<header>Controlled sea-trade fixture using the production renderer and Empire panel.
<button id="advance">Advance 80 ticks</button><button id="cycle">Complete trade cycle</button><button id="publication">Use borrowed publication</button><button id="reconnect">Cold reconnect</button><button id="capture">Capture loaded ship</button><button id="intake">Show intake wait</button><button id="host-worker">Test production host worker</button></header>
<div id="app"></div><pre id="status" role="status"></pre>
<script type="module" src="./SeaTradeReview.ts"></script></html>
