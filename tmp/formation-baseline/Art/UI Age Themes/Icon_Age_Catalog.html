<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age icon catalog</title><style>
:root{color-scheme:dark;font-family:Segoe UI,sans-serif;background:#171b15;color:#edeadd}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:1250px;margin:auto}h1{font:28px Cambria,serif;margin:0 0 7px}p{font-size:12px;color:#b8c0ac}.toolbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px 0}label{font-size:12px;display:flex;gap:8px;align-items:center}select,input{font:inherit;background:#293025;color:#efeedd;border:1px solid #6e775b;padding:7px}#icons{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:11px}article{background:#21271e;border:1px solid #58604b;text-align:center;padding:10px 5px}canvas{display:block;width:72px;height:72px;margin:auto}h2{font-size:11px;font-weight:500;min-height:28px;margin:8px 0 2px;text-transform:capitalize}small{color:#acb8a0;font-size:9px}a{color:#c7d79c;font-size:10px;text-decoration:none;margin:0 5px}a:hover{text-decoration:underline}.links{margin-top:7px}#status{font-size:11px}select:focus-visible,input:focus-visible{outline:2px solid #c7df9b;outline-offset:3px}@media(max-width:1000px){#icons{grid-template-columns:repeat(6,1fr)}}@media(max-width:650px){body{padding:14px}#icons{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><h1>Icons through the ages</h1><p>259 framed versions · 21 buildings, 7 formations, 6 resource groups and 3 orders per age · shared faction tint masks</p><div class="toolbar"><label>Age <select id="age"></select></label><label>Faction <select id="faction"><option value="#ffffff">White master</option><option value="#7dccb4" selected>Teal</option><option value="#da8981">Red</option><option value="#dfc784">Gold</option></select></label><label>Category <select id="category"><option>All</option><option>Buildings</option><option>Formations</option><option>Resources</option><option>Commands</option></select></label><label>Find <input id="find" type="search" placeholder="Icon name"></label><a href="Runtime_Theme_Review.html">Production UI review ↗</a></div><div id="icons" aria-label="Age icon set"></div><p id="status" role="status">Loading…</p></main><script type="module">
const manifest=await fetch('./age-icons.json').then(r=>r.json());const themes=(await fetch('./themes.json').then(r=>r.json())).themes;const atlasImages=new Map();const maskImages=new Map();const age=document.querySelector('#age'),faction=document.querySelector('#faction'),category=document.querySelector('#category'),find=document.querySelector('#find');let version=0;
const load=async src=>{const image=new Image();image.src=src;await image.decode();return image};
for(const theme of themes){const option=document.createElement('option');option.value=theme.age;option.textContent=`${theme.name} · ${theme.material}`;age.append(option)}
async function render(){const revision=++version;const theme=themes.find(t=>t.age===age.value);if(!atlasImages.has(theme.age))atlasImages.set(theme.age,await load(`./icons/${theme.age}/atlas.png`));const atlas=atlasImages.get(theme.age);const tint=faction.value.match(/\w\w/g).map(v=>parseInt(v,16));const visible=manifest.assets.filter(a=>(category.value==='All'||a.category===category.value)&&a.label.toLowerCase().includes(find.value.toLowerCase()));const cards=[];for(const asset of visible){if(!maskImages.has(asset.id))maskImages.set(asset.id,await load(asset.mask));const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=144;canvas.height=144;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`${asset.label} ${theme.material} frame`);const ctx=canvas.getContext('2d');ctx.drawImage(atlas,asset.frame.x,asset.frame.y,96,96,0,0,144,144);const mask=document.createElement('canvas');mask.width=144;mask.height=144;const m=mask.getContext('2d');m.drawImage(maskImages.get(asset.id),0,0,144,144);const pixels=ctx.getImageData(0,0,144,144),weights=m.getImageData(0,0,144,144).data;for(let i=0;i<pixels.data.length;i+=4){const weight=weights[i]/255;for(let c=0;c<3;c++)pixels.data[i+c]*=1-weight+weight*tint[c]/255}ctx.putImageData(pixels,0,0);const title=document.createElement('h2');title.textContent=asset.label;const label=document.createElement('small');label.textContent=asset.category;const links=document.createElement('div');links.className='links';for(const kind of ['png','svg']){const a=document.createElement('a');a.href=`./icons/${theme.age}/${kind}/${asset.id}.${kind}`;a.textContent=kind.toUpperCase();a.target='_blank';links.append(a)}card.append(canvas,title,label,links);cards.push(card)}if(revision!==version)return;document.querySelector('#icons').replaceChildren(...cards);document.querySelector('#status').textContent=`${visible.length} / 37 icons · ${theme.material} frame retains its color · centers recolored by faction`;}
for(const element of [age,faction,category])element.addEventListener('change',()=>render().catch(console.error));find.addEventListener('input',()=>render().catch(console.error));await render();
</script></body></html>
