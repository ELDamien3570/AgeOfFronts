<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Age-up research alert review</title>
  <link rel="stylesheet" href="/src/skirmish/client/style.css" />
  <link rel="stylesheet" href="/src/skirmish/client/age-theme.css" />
  <style>
    body {
      background: #10212b;
      color: #eee9da;
      font: 15px system-ui;
    }
    .review {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }
    .controls button,
    .controls select {
      font-size: 13px;
      padding: 9px 12px;
    }
    #app {
      display: block;
      height: auto;
      padding: 16px;
      overflow: visible;
    }
    #app .battlefield {
      height: 580px;
    }
    .current-age {
      position: absolute;
      left: 18px;
      top: 18px;
      width: min(260px, 35%);
      padding: 16px;
    }
    .current-age h2 {
      font-size: 20px;
      margin: 0 0 10px;
    }
    .current-age p {
      font-size: 13px;
      margin: 6px 0;
    }
    #status {
      display: block;
      margin-top: 14px;
      min-height: 28px;
    }
    @media (max-width: 650px) {
      .current-age {
        width: calc(100% - 36px);
      }
      #app .research-opportunities {
        top: 185px;
        max-height: 365px;
      }
    }
  </style>
  <main class="review">
    <h1>Age-up research alert</h1>
    <p>
      The production alert list prioritizes eligible age advancement and
      previews the destination age's material border. Ordinary research keeps
      the current age's frame.
    </p>
    <div class="controls">
      <label for="age">Current age</label
      ><select id="age"></select>
      <button id="funded">Fully funded</button>
      <button id="short">Below age-up cost</button>
      <button id="reset">Reset eligible research</button>
      <button id="finish" disabled>Finish advancement</button>
    </div>
    <div id="app">
      <div class="battlefield">
        <section class="current-age hud-surface">
          <h2 id="earned-age"></h2>
          <p>Current HUD frame</p>
          <p id="gold"></p>
          <p id="quote"></p>
        </section>
      </div>
    </div>
    <output id="status" aria-live="polite"></output>
  </main>
  <script type="module">
    import { GameMapImpl } from "/src/core/game/GameMap.ts";
    import { AgeThemeView } from "/src/skirmish/client/AgeThemeView.ts";
    import { EmpireViewModel } from "/src/skirmish/client/EmpireViewModel.ts";
    import { ResearchOpportunitiesView } from "/src/skirmish/client/ResearchOpportunitiesView.ts";
    import { TECHNOLOGIES } from "/src/skirmish/content/Technology.ts";
    import { AGE_NAMES, AGES } from "/src/skirmish/domain/Definitions.ts";
    import { Skirmish } from "/src/skirmish/Simulation.ts";

    const cells = new Uint8Array(48 * 48).fill(133);
    const match = new Skirmish(new GameMapImpl(48, 48, cells, cells.length), {
      seed: 42,
      aiCount: 1,
      tribes: false,
      runAi: false,
      ruleset: "ages-v1",
    });
    const state = match.expansion.progression.states[1];
    const startingResearch = [...state.completed];
    const root = document.querySelector("#app");
    const theme = new AgeThemeView(root);
    const status = document.querySelector("#status");
    const view = new ResearchOpportunitiesView(
      root.querySelector(".battlefield"),
      (command) => {
        const rejection = match.applyCommand(command);
        status.textContent =
          rejection ??
          (command.type === "advance-age"
            ? "Age advancement started; the age-up alert has been removed."
            : "Research started.");
        update();
      },
    );
    const model = () =>
      new EmpireViewModel(match.snapshot(), {
        selected: new Set(),
        selectedShips: new Set(),
        selectedBuilding: null,
      });
    const picker = document.querySelector("#age");
    picker.innerHTML = AGES.map(
      (age, i) => `<option value="${age}">${AGE_NAMES[i]}</option>`,
    ).join("");
    function update() {
      const vm = model();
      theme.update(state.age);
      view.update(vm);
      picker.value = state.age;
      document.querySelector("#earned-age").textContent = vm.ageName;
      document.querySelector("#gold").textContent =
        `${vm.player.gold.toLocaleString("en-US")} gold available`;
      document.querySelector("#quote").textContent = vm.advance.cost
        ? `Age-up cost: ${vm.advance.cost.gold.toLocaleString("en-US")} gold`
        : "Final age";
      document.querySelector("#finish").disabled = !state.advancement;
    }
    function ready() {
      state.age = picker.value;
      state.completed = [
        ...new Set([
          ...startingResearch,
          ...TECHNOLOGIES.filter(
            (t) =>
              t.age === state.age &&
              (t.tree === "naval" || t.tree === "warfare"),
          ).map((t) => t.id),
        ]),
      ];
      state.research = {};
      state.advancement = null;
      theme.reset();
      match.players[0].gold = (model().advance.cost?.gold ?? 0) + 5000;
      status.textContent = model().advance.cost
        ? "Two trees complete. An affordable age-up appears first."
        : "Final age reached. There is no further age-up alert.";
      update();
    }
    picker.onchange = ready;
    document.querySelector("#reset").onclick = ready;
    document.querySelector("#funded").onclick = () => {
      match.players[0].gold = (model().advance.cost?.gold ?? 0) + 5000;
      status.textContent =
        "Fully funded; eligible age advancement takes first position.";
      update();
    };
    document.querySelector("#short").onclick = () => {
      match.players[0].gold = Math.max(
        0,
        (model().advance.cost?.gold ?? 1) - 1,
      );
      status.textContent =
        "One gold short: the age-up alert disappears, with remaining research preserved.";
      update();
    };
    document.querySelector("#finish").onclick = () => {
      while (state.advancement) match.expansion.progression.step(match.players);
      status.textContent =
        "Advancement completed; the HUD now uses the earned age's frame.";
      update();
    };
    ready();
  </script>
</html>
