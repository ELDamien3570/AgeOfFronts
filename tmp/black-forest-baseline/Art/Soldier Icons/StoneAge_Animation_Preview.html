<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soldier Animation Review</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141819; color: #edf0eb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1140px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    h1 { font-size: 27px; margin: 0 0 5px; font-weight: 650; letter-spacing: -.6px; }
    .subtitle { margin: 0; font-size: 14px; color: #aab5ac; }
    .badge { color: #e2b875; border: 1px solid #655139; border-radius: 20px; padding: 7px 12px; font-size: 12px; white-space: nowrap; }
    .age-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .age-tabs [aria-selected=true] { background: #d5b071; color: #19201d; border-color: #d5b071; font-weight: 700; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #a5dfda; outline-offset: 3px; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; background: #212728; border: 1px solid #343d3d; border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; }
    button, select { color: #eff1eb; background: #303939; border: 1px solid #4d5b59; border-radius: 7px; padding: 7px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    button:hover { background: #46514f; }
    #play { background: #d5b071; color: #19201d; border-color: #d5b071; font-weight: 700; min-width: 80px; }
    label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #c5cdc6; }
    input[type=range] { accent-color: #d5b071; width: 145px; }
    input[type=checkbox] { accent-color: #d5b071; }
    #frame-output { min-width: 58px; font-size: 12px; font-variant-numeric: tabular-nums; color: #d7c9ac; }
    .spacer { flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    article { background: #202626; border: 1px solid #35413e; border-radius: 12px; overflow: hidden; }
    article header { flex-wrap: wrap; margin: 0; padding: 10px 14px; border-bottom: 1px solid #35413e; }
    article h2 { margin: 0; font-size: 14px; font-weight: 600; }
    article span { color: #d5b071; font-size: 12px; }
    .stage { position: relative; background-color: #2c3633; background-image: linear-gradient(45deg,#35403c 25%,transparent 25%),linear-gradient(-45deg,#35403c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#35403c 75%),linear-gradient(-45deg,transparent 75%,#35403c 75%); background-size: 28px 28px; background-position: 0 0,0 14px,14px -14px,-14px 0; }
    .solid .stage { background-image: none; background-color: #263829; }
    canvas { display: block; width: 100%; aspect-ratio: 1; }
    article footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 7px 14px; font-size: 11px; color: #99aaa0; }
    article a { color: #c8b991; text-decoration: none; }
    .frame { font-variant-numeric: tabular-nums; }
    .empty { grid-column: 1 / -1; padding: 30px 15px; color: #aab5ac; }
    .inspection-link { color: #c8b991; font-size: 12px; }
    #status { color: #aab5ac; font-size: 12px; margin: 16px 0 0; }
    @media (max-width: 760px) { body { padding: 15px; } .grid { grid-template-columns: repeat(2,1fr); } .badge { display: none; } }
    @media (max-width: 470px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1 id="review-title">Soldier Animation Review</h1><p class="subtitle" id="review-subtitle">Straight overhead view · full squads</p></div>
      <div class="badge" id="badge">9 clips · transparent PNG</div>
    </header>
    <nav class="age-tabs" id="cultures" role="tablist" aria-label="Civilization"></nav>
    <nav class="age-tabs" id="ages" role="tablist" aria-label="Unit age"></nav>
    <div class="toolbar">
      <button id="play" type="button">Pause</button>
      <button id="restart" type="button">Replay</button>
      <button id="previous" type="button" aria-label="Previous frame">‹</button>
      <button id="next" type="button" aria-label="Next frame">›</button>
      <label>Frame <input id="frame" type="range" min="0" max="9" value="0" aria-label="Animation frame"></label>
      <output id="frame-output">1 / 10</output>
      <span class="spacer"></span>
      <label>Speed <select id="speed"><option value="0.5">½ speed</option><option value="1" selected>Normal</option><option value="1.5">1½ speed</option></select></label>
      <label><input id="repeat" type="checkbox">Repeat reactions for review</label>
      <label><input id="pivot" type="checkbox">Show pivot</label>
      <label><input id="background" type="checkbox">Solid ground</label>
    </div>
    <section id="age-panel" role="tabpanel" aria-busy="true"><div class="grid" id="clips"></div></section>
    <p id="status" role="status">Loading sprite sheets…</p>
    <p><a class="inspection-link" id="siege-link" href="../Weapon%20Icons/Weapon-Review.html?category=Siege%20Weapons">Siege inspection ↗</a></p>
  </main>
  <script type="module" src="soldier-review.js?v=3a834e248ab5"></script>
</body>
</html>
